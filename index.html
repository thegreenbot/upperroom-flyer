<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Fellowship</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --ink:      #0A0912;
      --ink-2:    #150F26;
      --ink-3:    #1D1638;
      --violet:   #8B2FF0;
      --magenta:  #FF2E7E;
      --acid:     #FFD23F;
      --paper:    #F5F2FF;
      --muted:    #B3A6D9;
      --line:     rgba(245,242,255,0.12);
    }

    html, body { background: var(--ink); }
    body {
      font-family: 'DM Sans', system-ui, -apple-system, sans-serif;
      color: var(--paper);
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    /* ── LOADING / ERROR ── */
    .state-overlay {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 70vh;
      gap: 1rem;
      color: var(--muted);
      font-size: 0.9rem;
    }
    .spinner {
      width: 32px; height: 32px;
      border: 3px solid var(--line);
      border-top-color: var(--magenta);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .error-box {
      background: var(--ink-2);
      border: 1px solid rgba(255,46,126,0.35);
      border-radius: 10px;
      padding: 1.25rem 1.5rem;
      max-width: 480px;
      margin: 0 auto;
      text-align: center;
    }
    .error-box strong { color: var(--magenta); display: block; margin-bottom: 0.4rem; }
    .error-box p { color: var(--muted); font-size: 0.85rem; line-height: 1.5; white-space: pre-line; }

    /* ── HERO ───────────────────────────────────────────── */
    .hero {
      position: relative;
      min-height: 78vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 3rem 1.75rem 3.5rem;
      overflow: hidden;
      background-color: var(--ink);
      background-image:
        radial-gradient(ellipse 70% 55% at center, rgba(255,46,126,0.28) 0%, transparent 60%),
        radial-gradient(ellipse 60% 60% at center, rgba(139,47,240,0.35) 0%, transparent 65%);
      background-repeat: no-repeat;
      background-size: 160% 160%, 150% 150%;
      background-position: 88% 2%, 6% 96%;
      animation: heroDrift 18s ease-in-out infinite alternate;
    }
    @keyframes heroDrift {
      0%   { background-position: 88% 2%,  6% 96%; }
      50%  { background-position: 70% 14%, 22% 82%; }
      100% { background-position: 80% -6%, 12% 104%; }
    }

    /* halftone dot field */
    .hero::before {
      content: '';
      position: absolute; inset: 0;
      background-image: radial-gradient(rgba(245,242,255,0.14) 1.1px, transparent 1.1px);
      background-size: 14px 14px;
      -webkit-mask-image: linear-gradient(115deg, transparent 30%, black 55%, transparent 78%);
              mask-image: linear-gradient(115deg, transparent 30%, black 55%, transparent 78%);
      pointer-events: none;
    }

    /* comic speed-lines bursting from behind title */
    .speed-lines { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
    .speed-lines i {
      position: absolute;
      right: -10%;
      top: 50%;
      height: 2px;
      background: linear-gradient(90deg, transparent, rgba(255,210,63,0.55) 40%, transparent);
      transform-origin: right center;
      opacity: 0;
      animation: zap 900ms cubic-bezier(.2,.8,.2,1) forwards;
    }
    @keyframes zap {
      0%   { opacity: 0; transform: translateX(30px) scaleX(0.3); }
      35%  { opacity: 1; }
      100% { opacity: 0; transform: translateX(-40vw) scaleX(1); }
    }

    .eyebrow-row {
      position: relative; z-index: 1;
      display: flex; align-items: center; gap: .6rem;
      margin-bottom: 1.1rem;
      opacity: 0;
      animation: riseIn 560ms 900ms cubic-bezier(.16,1,.3,1) forwards;
    }
    .eyebrow-bolt {
      width: 9px; height: 9px; background: var(--acid);
      clip-path: polygon(50% 0,100% 38%,68% 38%,100% 100%,0 62%,32% 62%);
      flex-shrink: 0;
    }
    .eyebrow {
      font-size: .72rem; font-weight: 700; letter-spacing: .24em;
      text-transform: uppercase; color: var(--acid);
    }

    .title-wrap { position: relative; z-index: 1; overflow: hidden; padding: .2rem 0; }
    .church-name {
      font-family: 'Segoe UI Black', 'Arial Black', system-ui, sans-serif;
      font-weight: 900;
      text-transform: uppercase;
      font-size: clamp(2.6rem, 12vw, 5.2rem);
      line-height: .92;
      letter-spacing: -.01em;
      display: inline-block;
      background: linear-gradient(100deg, var(--paper) 0%, var(--paper) 30%, var(--magenta) 65%, var(--violet) 100%);
      -webkit-background-clip: text; background-clip: text; color: transparent;
      filter: drop-shadow(3px 3px 0 rgba(139,47,240,0.9)) drop-shadow(6px 6px 0 rgba(10,9,18,0.9));
      transform: translateX(140%) skewX(-11deg) scale(1.05);
      animation: slamIn 780ms 120ms cubic-bezier(.16,.9,.24,1.05) forwards;
    }
    @keyframes slamIn {
      0%   { transform: translateX(140%) skewX(-11deg) scale(1.05); }
      65%  { transform: translateX(-2%) skewX(-9deg) scale(1); }
      82%  { transform: translateX(1.2%) skewX(-9deg) scale(1); }
      100% { transform: translateX(0) skewX(-9deg) scale(1); }
    }

    .group-name {
      position: relative; z-index: 1;
      font-size: clamp(1rem, 3.5vw, 1.35rem);
      font-weight: 700; font-style: italic;
      letter-spacing: .01em;
      color: var(--paper);
      margin-top: .5rem;
      padding-left: .15rem;
      opacity: 0;
      animation: riseIn 560ms 760ms cubic-bezier(.16,1,.3,1) forwards;
    }

    @keyframes riseIn { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }

    .hero-meta { position: relative; z-index: 1; display: flex; flex-wrap: wrap; gap: .55rem; margin-top: 1.75rem; }
    .meta-chip {
      display: flex; align-items: center; gap: .4rem;
      background: var(--ink-3);
      border: 1px solid var(--line);
      clip-path: polygon(10px 0, 100% 0, calc(100% - 10px) 100%, 0 100%);
      padding: .4rem 1rem .4rem .8rem;
      font-size: .83rem; font-weight: 600; color: var(--paper);
      opacity: 0;
      animation: chipIn 460ms cubic-bezier(.16,1,.3,1) forwards;
    }
    .meta-chip:nth-child(1) { animation-delay: 1020ms }
    .meta-chip:nth-child(2) { animation-delay: 1090ms }
    .meta-chip:nth-child(3) { animation-delay: 1160ms }
    @keyframes chipIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

    /* ── TOPIC ──────────────────────────────────────────── */
    .content { max-width: 640px; margin: 0 auto; padding: 2.75rem 1.5rem 0; }
    .panel-label {
      display: inline-flex; align-items: center; gap: .5rem;
      font-size: .72rem; font-weight: 800; letter-spacing: .18em;
      text-transform: uppercase; color: var(--magenta);
      margin-bottom: .9rem;
    }
    .panel-label::before { content: ''; width: 18px; height: 3px; background: var(--magenta); }

    .topic-panel {
      position: relative;
      background: var(--ink-2);
      border: 1px solid var(--line);
      clip-path: polygon(0 0, 100% 0, 100% calc(100% - 18px), calc(100% - 18px) 100%, 0 100%);
      padding: 1.6rem 1.6rem 1.8rem;
    }
    .topic-panel::before {
      content: '';
      position: absolute; left: 0; top: 0; bottom: 0; width: 5px;
      background: linear-gradient(180deg, var(--magenta), var(--violet));
    }
    .topic-title {
      font-family: 'Segoe UI Black', 'Arial Black', system-ui, sans-serif;
      font-weight: 900; text-transform: uppercase;
      font-size: clamp(1.5rem, 5.5vw, 2.1rem);
      line-height: 1.05; letter-spacing: -.005em;
      transform: skewX(-6deg); display: inline-block;
      color: var(--paper);
    }
    .topic-subtitle { font-size: .85rem; font-weight: 700; color: var(--acid); margin-top: .5rem; letter-spacing: .02em; }
    .topic-desc {
      font-size: .92rem; color: var(--muted); line-height: 1.65;
      margin-top: 1rem; padding-top: 1rem; border-top: 1px dashed var(--line);
    }

    /* ── SCHEDULE ───────────────────────────────────────── */
    .schedule-section { max-width: 640px; margin: 0 auto; padding: 2.5rem 1.5rem 0; }
    .schedule-list { list-style: none; }
    .schedule-item {
      display: grid; grid-template-columns: 3.4rem 1fr;
      padding: 1rem 0; border-bottom: 1px solid var(--line);
    }
    .schedule-item:last-child { border-bottom: none; }
    .s-num {
      font-family: 'Segoe UI Black', 'Arial Black', system-ui, sans-serif;
      font-weight: 900; font-size: 1.6rem; font-style: italic;
      color: transparent;
      -webkit-text-stroke: 1.4px var(--violet);
      align-self: start;
    }
    .s-time { font-size: .68rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--magenta); }
    .s-label { font-size: 1.02rem; font-weight: 800; color: var(--paper); margin-top: .15rem; }
    .s-desc  { font-size: .85rem; color: var(--muted); margin-top: .25rem; }
    .s-leader {
      display: inline-flex; margin-top: .45rem;
      font-size: .72rem; font-weight: 800; letter-spacing: .03em;
      color: var(--ink); background: var(--acid);
      padding: .2rem .6rem;
      clip-path: polygon(6px 0, 100% 0, calc(100% - 6px) 100%, 0 100%);
    }

    /* ── FOOTER ─────────────────────────────────────────── */
    .footer {
      max-width: 640px; margin: 2.75rem auto 0;
      padding: 1.5rem 1.5rem 3rem;
      border-top: 1px solid var(--line);
      display: flex; align-items: center; justify-content: space-between;
      flex-wrap: wrap; gap: .75rem;
    }
    .footer-info .name   { font-weight: 800; font-size: .92rem; color: var(--paper); }
    .footer-info .detail { font-size: .8rem; color: var(--muted); margin-top: .1rem; }
    .welcome-badge {
      background: linear-gradient(100deg, var(--violet), var(--magenta));
      color: var(--paper); font-size: .72rem; font-weight: 800; letter-spacing: .08em;
      text-transform: uppercase; padding: .4rem 1rem;
      clip-path: polygon(8px 0, 100% 0, calc(100% - 8px) 100%, 0 100%);
    }

    /* ── SHARE / QR ─────────────────────────────────────── */
    .share-section { max-width: 640px; margin: 0 auto; padding: 0 1.5rem 3.5rem; }
    .qr-panel {
      position: relative;
      display: flex; align-items: center; gap: 1.25rem;
      background: var(--ink-2);
      border: 1px solid var(--line);
      clip-path: polygon(0 0, 100% 0, 100% calc(100% - 18px), calc(100% - 18px) 100%, 0 100%);
      padding: 1.4rem 1.6rem;
    }
    .qr-panel::before {
      content: '';
      position: absolute; left: 0; top: 0; bottom: 0; width: 5px;
      background: linear-gradient(180deg, var(--violet), var(--magenta));
    }
    .qr-code-img {
      flex-shrink: 0;
      width: 108px; height: 108px;
      background: var(--paper);
      padding: 6px;
      border-radius: 4px;
    }
    .qr-copy .panel-label { margin-bottom: .5rem; }
    .qr-caption { font-size: .85rem; color: var(--muted); line-height: 1.5; }
    .qr-link {
      display: inline-block; margin-top: .4rem;
      font-size: .78rem; font-weight: 700; color: var(--paper);
      word-break: break-all;
    }
    @media (max-width: 480px) {
      .qr-panel { flex-direction: column; align-items: flex-start; text-align: left; }
    }

    @media (max-width: 480px) {
      .hero { padding: 2.25rem 1.25rem; min-height: 70vh; }
      .content, .schedule-section, .footer { padding-left: 1.1rem; padding-right: 1.1rem; }
    }
    @media (prefers-reduced-motion: reduce) {
      .church-name, .group-name, .eyebrow-row, .meta-chip, .speed-lines i, .hero {
        animation: none !important; opacity: 1 !important; transform: none !important;
      }
    }
    @media print {
      body { background: white; }
      .hero { print-color-adjust: exact; -webkit-print-color-adjust: exact; }
    }
  </style>
</head>
<body>

<!-- ════════════════════════════════════════════════════════════
     CONFIG — paste your Google Sheet ID here (one place only)
     Sheet must be shared: Anyone with the link → Viewer
     ════════════════════════════════════════════════════════════ -->
<script>
  const SHEET_ID = '1xURkd2MT65cvX1YJmYBlXpdwKtKgkYTjt8IaqSnvi4w';
  // ↑ Find this in your Sheet URL:
  //   https://docs.google.com/spreadsheets/d/<<THIS PART>>/edit
</script>

<!-- page skeleton — JS fills these in -->
<header class="hero" style="display:none" id="hero">
  <div class="speed-lines">
    <i style="top:22%; width:60%; animation-delay:80ms"></i>
    <i style="top:38%; width:75%; animation-delay:160ms"></i>
    <i style="top:58%; width:50%; animation-delay:40ms"></i>
    <i style="top:72%; width:68%; animation-delay:200ms"></i>
  </div>

  <div class="eyebrow-row">
    <span class="eyebrow-bolt"></span>
    <span class="eyebrow">Sunday Evening</span>
  </div>

  <div class="title-wrap">
    <span class="church-name" id="js-church"></span>
  </div>
  <p class="group-name" id="js-group"></p>

  <div class="hero-meta" id="js-meta"></div>
</header>

<div id="loading" class="state-overlay">
  <div class="spinner"></div>
  <p>Loading meeting info…</p>
</div>

<div id="error" class="state-overlay" style="display:none; padding: 2rem;">
  <div class="error-box">
    <strong>Couldn't load the schedule</strong>
    <p id="error-msg"></p>
  </div>
</div>

<div id="page-content" style="display:none">
  <div class="content">
    <p class="panel-label">This week's discussion</p>
    <div class="topic-panel">
      <h2 class="topic-title"   id="js-topic-title"></h2>
      <p  class="topic-subtitle" id="js-topic-sub"></p>
      <p  class="topic-desc"     id="js-topic-desc"></p>
    </div>
  </div>

  <section class="schedule-section">
    <p class="panel-label" style="margin-top:0.4rem">Tonight's lineup</p>
    <ul class="schedule-list" id="js-schedule"></ul>
  </section>

  <footer class="footer">
    <div class="footer-info">
      <p class="name"   id="js-footer-name"></p>
      <p class="detail" id="js-footer-detail"></p>
    </div>
    <span class="welcome-badge">All are welcome</span>
  </footer>

  <section class="share-section">
    <p class="panel-label">Share this flyer</p>
    <div class="qr-panel">
      <img
        class="qr-code-img"
        src="https://api.qrserver.com/v1/create-qr-code/?size=200x200&margin=8&color=150F26&bgcolor=F5F2FF&data=https%3A%2F%2Fthegreenbot.github.io%2Fupperroom-flyer%2F"
        alt="QR code linking to this flyer"
        width="108" height="108"
        loading="lazy"
      >
      <div class="qr-copy">
        <p class="qr-caption">Scan to pull this page up on your phone and pass it along.</p>
        <a class="qr-link" href="https://thegreenbot.github.io/upperroom-flyer/">thegreenbot.github.io/upperroom-flyer</a>
      </div>
    </div>
  </section>
</div>

<script>
// ── CSV helpers ─────────────────────────────────────────────────────
function parseCSVRow(line) {
  const result = []; let cur = '', inQ = false;
  for (let i = 0; i < line.length; i++) {
    if (line[i] === '"') {
      if (inQ && line[i+1] === '"') { cur += '"'; i++; }
      else inQ = !inQ;
    } else if (line[i] === ',' && !inQ) { result.push(cur); cur = ''; }
   else cur += line[i];
  }
  result.push(cur);
  return result.map(s => s.trim());
}

function parseCSV(text) {
  const lines = text.trim().split('\n').filter(Boolean);
  const headers = parseCSVRow(lines[0]);
  return lines.slice(1).map(line => {
    const vals = parseCSVRow(line);
    const obj = {};
    headers.forEach((h, i) => obj[h] = vals[i] || '');
    return obj;
  });
}

async function fetchSheet(sheetName) {
  const url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent(sheetName)}`;
  const res = await fetch(url);
  if (!res.ok) throw new Error(`HTTP ${res.status} loading "${sheetName}" tab`);
  return parseCSV(await res.text());
}

// ── Render helpers ──────────────────────────────────────────────────
function chip(text) {
  const el = document.createElement('span');
  el.className = 'meta-chip';
  el.textContent = text;
  return el;
}

function scheduleItem(row, index) {
  const li = document.createElement('li');
  li.className = 'schedule-item';
  const num = String(index + 1).padStart(2, '0');
  const leaderHTML = row.Leader
    ? `<span class="s-leader">👤 ${row.Leader}</span>`
    : '';
  li.innerHTML = `
    <span class="s-num">${num}</span>
    <div>
      <p class="s-time">${row.Time}</p>
      <p class="s-label">${row.Label}</p>
      <p class="s-desc">${row.Description}</p>
      ${leaderHTML}
    </div>`;
  return li;
}

// ── Main load ───────────────────────────────────────────────────────
async function load() {
  try {
    if (!SHEET_ID || SHEET_ID === 'YOUR_GOOGLE_SHEET_ID_HERE') {
      throw new Error('Open the HTML file and replace YOUR_GOOGLE_SHEET_ID_HERE with your actual Google Sheet ID.');
    }

    const [meetingRows, scheduleRows] = await Promise.all([
      fetchSheet('MeetingDetails'),
      fetchSheet('Schedule')
    ]);

    // Meeting tab is key→value pairs
    const m = {};
    meetingRows.forEach(r => { if (r.Field) m[r.Field] = r.Value; });

    // Populate hero
    document.title = `${m.group || 'Student Fellowship'} — ${m.church || ''}`;
    document.getElementById('js-church').textContent = m.church || '';
    document.getElementById('js-group').textContent  = m.group  || '';

    const metaEl = document.getElementById('js-meta');
    [m.date, m.time, m.location].filter(Boolean).forEach(t => metaEl.appendChild(chip(t)));

    // Topic
    document.getElementById('js-topic-title').textContent = m.topic        || '';
    document.getElementById('js-topic-sub').textContent   = m.topicSubtitle || '';
    document.getElementById('js-topic-desc').textContent  = m.topicDesc    || '';

    // Schedule
    const listEl = document.getElementById('js-schedule');
    scheduleRows.forEach((row, i) => listEl.appendChild(scheduleItem(row, i)));

    // Footer
    document.getElementById('js-footer-name').textContent = m.church || '';
    const detail = [m.contact, m.contactEmail].filter(Boolean).join(' · ');
    document.getElementById('js-footer-detail').textContent = detail;

    // Show page
    document.getElementById('loading').style.display = 'none';
    document.getElementById('hero').style.display    = '';
    document.getElementById('page-content').style.display = '';

  } catch (err) {
    document.getElementById('loading').style.display = 'none';
    document.getElementById('error').style.display   = 'flex';
    document.getElementById('error-msg').textContent =
      err.message + '\n\nMake sure the sheet is shared as "Anyone with the link → Viewer".';
  }
}

load();
</script>
</body>
</html>
